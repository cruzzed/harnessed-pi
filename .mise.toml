[tools]
node = "26"

[tasks.test]
description = "Unit tests for extensions (node --test, type-stripped TS)"
run = 'node --test "extensions/**/*.test.ts"'

[tasks.apply]
description = "Materialize the harness-owned soul subset (~/.pi/agent/extensions/safety-gate)"
run = "scripts/soul apply"

[tasks.verify]
description = "Verify the soul matches the repo (writability + checksums); fails on drift"
run = "scripts/soul verify"

[tasks."check"]
description = "test + apply + verify — the only path from repo to soul"
run = ["mise run test", "mise run apply", "mise run verify"]
